services:
  - type: web
    name: ai-vip-diamond
    runtime: python
    plan: free
    buildCommand: "pip install --no-cache-dir -r requirements.txt"
    startCommand: "uvicorn server_ai_vip:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: CARGO_HOME
        value: /tmp/cargo
      - key: PIP_NO_CACHE_DIR
        value: "1"
